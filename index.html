<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Professional Resume Builder - Create stunning, ATS-friendly resumes in minutes">
    <meta name="keywords" content="resume builder, CV maker, professional resume, ATS-friendly, job application">
    <title>MRA Resume Builder - Professional Resume Maker</title>
    
    <!-- GitHub Pages SPA routing support -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="MRA Resume Builder - Professional Resume Maker">
    <meta property="og:description" content="Create stunning, ATS-friendly resumes with our modern, intuitive builder. Choose from professional templates and customize everything to match your style.">
    <meta property="og:image" content="/profile_pic.png">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="MRA Resume Builder - Professional Resume Maker">
    <meta property="twitter:description" content="Create stunning, ATS-friendly resumes with our modern, intuitive builder. Choose from professional templates and customize everything to match your style.">
    <meta property="twitter:image" content="/profile_pic.png">
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
