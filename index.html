<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="mask-icon" href="/favicon.svg?v=2" color="#1d4ed8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create polished, print-ready resumes and marriage biodatas in minutes. Choose a template, customize everything, and export to PDF, PNG, or JPG.">
    <meta name="keywords" content="resume builder, CV maker, marriage biodata, biodata maker, professional resume, ATS-friendly, job application">
    <title>MRA Builder - Resume & Marriage Biodata Maker</title>
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="MRA Builder - Resume & Marriage Biodata Maker">
    <meta property="og:description" content="Create polished, print-ready resumes and marriage biodatas in minutes. Choose a template, customize everything, and export to PDF, PNG, or JPG.">
    <meta property="og:image" content="/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="MRA Builder - Resume & Marriage Biodata Maker">
    <meta property="twitter:description" content="Create polished, print-ready resumes and marriage biodatas in minutes. Choose a template, customize everything, and export to PDF, PNG, or JPG.">
    <meta property="twitter:image" content="/og-image.png">
    
    <meta name="color-scheme" content="light dark">

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Apply saved theme before paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('mra-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
