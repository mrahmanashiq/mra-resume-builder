<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="mask-icon" href="/favicon.svg?v=2" color="#1d4ed8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Per-route title/description/canonical/OG/Twitter and JSON-LD are managed
         by @unhead (see src/seo/site.js + router meta). This default title only
         covers the brief pre-hydration moment; @unhead replaces it per route. -->
    <title>Free Resume &amp; Marriage Biodata Maker - Resume Builder</title>
    <meta name="color-scheme" content="light dark">

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Apply saved theme before paint to avoid a flash of the wrong theme.
         Light is the default; only an explicit saved 'dark' choice turns dark on. -->
    <script>
      (function () {
        try {
          document.documentElement.classList.toggle('dark', localStorage.getItem('mra-theme') === 'dark');
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
